name: Prescripto CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # -----------------------------
      # 1. Checkout Repository
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -----------------------------
      # 3. Install Dependencies
      # -----------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # -----------------------------
      # 4. Lint
      # -----------------------------
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Lint admin
        working-directory: admin
        run: npm run lint

      # -----------------------------
      # 5. Build Applications
      # -----------------------------
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build admin
        working-directory: admin
        run: npm run build

      # -----------------------------
      # 6. Login to GHCR
      # -----------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # 7. Build Docker Images
      # -----------------------------
      - name: Build backend image
        run: docker build -t ghcr.io/vishwak-tech/prescripto-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }} -t ghcr.io/vishwak-tech/prescripto-frontend:${{ github.sha }} ./frontend

      - name: Build admin image
        run: docker build -t ghcr.io/vishwak-tech/prescripto-admin:${{ github.sha }} ./admin

      # -----------------------------
      # 8. Push Docker Images
      # -----------------------------
      - name: Push backend image
        run: docker push ghcr.io/vishwak-tech/prescripto-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ghcr.io/vishwak-tech/prescripto-frontend:${{ github.sha }}

      - name: Push admin image
        run: docker push ghcr.io/vishwak-tech/prescripto-admin:${{ github.sha }}

      # -----------------------------
      # 9. Deploy to EC2
      # -----------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/prescripto
            ./deploy.sh ${{ github.sha }}
